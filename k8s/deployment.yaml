apiVersion: apps/v1
kind: Deployment

metadata:
  name: autoflow

spec:
  replicas: 1

  selector:
    matchLabels:
      app: autoflow

  template:
    metadata:
      labels:
        app: autoflow

    spec:
      containers:
        - name: autoflow
          image: 846866515154.dkr.ecr.us-east-1.amazonaws.com/autoflow-us:latest

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: autoflow-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: autoflow-secrets
                  key: DB_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autoflow-secrets
                  key: DB_PASSWORD

            - name: API_SECURITY_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: autoflow-secrets
                  key: JWT_SECRET