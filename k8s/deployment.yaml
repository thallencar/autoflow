apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoflow-deployment
  namespace: default
  labels:
    app: autoflow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: autoflow
  template:
    metadata:
      labels:
        app: autoflow
    spec:
      containers:
        - name: autoflow
          image: 447488717019.dkr.ecr.us-east-1.amazonaws.com/autoflow-us:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: autoflow-config
            - secretRef:
                name: autoflow-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 15