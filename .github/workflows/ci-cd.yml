name: 🚀 CI Completo - AutoFlow

on:
  push:
    branches: [ main, develop, dev_bruna_newArq ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # Job 1: Análise Estática / Lint
  lint:
    name: 🔍 Análise Estática
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🔍 Executar Verificação de Estilo / Lint (Maven Validate)
        run: mvn validate
        continue-on-error: true

  # Job 2: Testes Unitários
  test:
    name: 🧪 Testes Unitários
    runs-on: ubuntu-latest
    needs: lint

    # Defina aqui se houver variáveis sensíveis vindas dos Secrets do repositório
    env:
      API_SECURITY_TOKEN_SECRET: ${{ secrets.API_SECURITY_TOKEN_SECRET }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🧪 Executar Testes e Gerar Cobertura (JaCoCo)
        # Se você usa variáveis de ambiente mapeadas para application.properties,
        # ou pode passar diretamente via parâmetro do Maven (-D):
        run: mvn clean test -Dapi.security.token.secret="${{ secrets.API_SECURITY_TOKEN_SECRET }}"

  # Job 3: Build do Projeto (Empacotamento .jar)
  build:
    name: 🏗️ Build (AutoFlow)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: 🏗️ Gerar Pacote da Aplicação (Jar)
        run: mvn package -DskipTests

      - name: 📦 Upload do Artefato JAR
        uses: actions/upload-artifact@v4
        with:
          name: autoflow-jar
          path: target/*.jar
          retention-days: 14

      - name: 📊 Build Summary
        run: |
          echo "## 🏗️ Build Summary - AutoFlow (Java ${{ env.JAVA_VERSION }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Java Version**: ${{ env.JAVA_VERSION }} (${{ env.JAVA_DISTRIBUTION }})" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
          echo "**Artefato**: Gerado com sucesso em target/" >> $GITHUB_STEP_SUMMARY

# Job 4: Build e Deploy da Imagem Docker para a AWS ECR
deploy-aws:
  name: 🚀 Enviar Imagem para AWS ECR
  runs-on: ubuntu-latest
  needs: build # Só executa se o build e os testes passarem

  steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔑 Configurar Credenciais da AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: 🔓 Login no Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: 🐳 Build e Push da Imagem Docker
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: app-autoflow # Nome do seu repositório no ECR
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
